name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip running tests (use with caution)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Get version
        id: version
        run: |
          cargo_version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: ${cargo_version}"

      - name: Check if version exists on crates.io
        id: check_version
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "Checking whether par-osm-rust ${version} exists on crates.io..."

          if cargo search par-osm-rust --limit 1 | grep -q "^par-osm-rust = \"${version}\""; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${version} already exists on crates.io"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${version} not found on crates.io; publish can proceed"
          fi

      - name: Run tests
        if: ${{ !inputs.skip_tests && steps.check_version.outputs.exists == 'false' }}
        run: cargo test --all-features --verbose

      - name: Dry run publish
        if: steps.check_version.outputs.exists == 'false'
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: steps.check_version.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

      - name: Version already exists
        if: steps.check_version.outputs.exists == 'true'
        run: |
          echo "::notice::Version ${{ steps.version.outputs.version }} already exists on crates.io. Skipping publish."

      - name: Discord notification
        if: success() && steps.check_version.outputs.exists == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: 'Published {{ EVENT_PAYLOAD.repository.name }} v${{ steps.version.outputs.version }} to crates.io!'
        continue-on-error: true
