[package]
name = "par-osm-rust"
version = "0.1.2"
edition = "2024"
rust-version = "1.87"
description = "Shared OpenStreetMap and SRTM fetch, parse, and cache utilities"
authors = ["Paul Robello <probello@gmail.com>"]
license = "MIT"
repository = "https://github.com/paulrobello/par-osm-rust"

[features]
# Default build pulls in the blocking `reqwest`-based network paths so the
# crate's documented public API (Overpass fetch, SRTM download, Overture CLI
# orchestration) works out of the box. Disable default features to compile
# only the pure subset: data model, parsing, writing, cache I/O, filter,
# synthetic IDs, and elevation. Async-only or no-network consumers can opt
# out with `default-features = false`. Breaking change in 0.2.0 (ARC-012).
default = ["blocking"]
blocking = ["dep:reqwest"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
log = "0.4"
memmap2 = "0.9"
osmpbf = "0.3.8"
quick-xml = "0.41"
reqwest = { version = "0.13", optional = true, features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27.0"
url = "2"
urlencoding = "2.1"
