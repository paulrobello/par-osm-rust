[package]
name = "par-osm-rust"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Shared OpenStreetMap and SRTM fetch, parse, and cache utilities"
authors = ["Paul Robello <probello@gmail.com>"]
license = "MIT"
repository = "https://github.com/paulrobello/par-osm-rust"

[features]
# Default build pulls in the blocking `reqwest`-based network paths so the
# crate's documented public API (Overpass fetch, SRTM download, Overture CLI
# orchestration) works out of the box. Disable default features to compile
# only the pure subset: data model, parsing, writing, cache I/O, filter,
# synthetic IDs, and elevation. Async-only or no-network consumers can opt
# out with `default-features = false`. Breaking change in 0.2.0 (ARC-012).
default = ["blocking"]
blocking = ["dep:reqwest"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
log = "0.4"
memmap2 = "0.9"
osmpbf = "0.3.8"
quick-xml = "0.41"
reqwest = { version = "0.13", optional = true, features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27.0"
url = "2"
urlencoding = "2.1"

[dev-dependencies]
# ARC-018: criterion benches for perf-critical parse/dedupe/write paths.
# Default features are sufficient; criterion does not need the crate's
# `blocking` feature (it is a dev-dep test/bench harness).
criterion = "0.5"

# ARC-018: criterion requires `harness = false` on each bench target so it
# can install its own `main`. One entry per file under benches/.
[[bench]]
name = "parse_osm_xml"
harness = false

[[bench]]
name = "write_osm_xml"
harness = false

[[bench]]
name = "merge_source_data"
harness = false
